name: Clean up Preview Deployment
on:
  pull_request:
    types: [closed]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  delete-preview:
    name: Destroy Neon database preview branch and Fly.io preview app
    if: >-
      !contains(github.event.pull_request.body, '[Skip preview]')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Delete Fly app
        uses: superfly/fly-pr-review-apps@1.6.0

      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Update PR comment with cleanup status
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          header: deploy-preview
          only_update: true
          skip_unchanged: true
          message: |
            :broom: Preview cleaned up — Fly app destroyed, Neon branch deleted.
