name: Clean up Preview Deployment
on:
  pull_request:
    types: [closed]

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

# Explicit `bash` turns on `-o pipefail`, so a failing command in a pipe fails
# the step instead of being masked.
defaults:
  run:
    shell: bash

jobs:
  delete-preview:
    name: Remove Vercel preview deployments and Neon database branch
    if: >-
      !contains(github.event.pull_request.body, '[Skip deploy]')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # Preview deploys are tagged with --meta prNumber=<n> in preview-deploy.yml.
      # Uses the REST API rather than `vercel list` / `vercel remove`: the CLI
      # resolves the team first, which a project-scoped VERCEL_TOKEN can't read.
      - name: Remove Vercel preview deployments
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          api="https://api.vercel.com"
          ids=$(curl -sS --fail-with-body -H "Authorization: Bearer $VERCEL_TOKEN" \
            "$api/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=100&meta-prNumber=$PR_NUMBER" \
            | jq -r --arg pr "$PR_NUMBER" \
              '.deployments[] | select(.target != "production" and .meta.prNumber == $pr) | .uid')
          if [[ -z "$ids" ]]; then
            echo "No preview deployments found for PR #$PR_NUMBER."
            exit 0
          fi
          for id in $ids; do
            curl -sS --fail-with-body -o /dev/null -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" \
              "$api/v13/deployments/$id?teamId=$VERCEL_ORG_ID"
            echo "Removed $id"
          done

      - name: Delete Neon Branch
        if: ${{ !cancelled() }}
        uses: neondatabase/delete-branch-action@v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Update PR comment with cleanup status
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: deploy-preview
          only_update: true
          skip_unchanged: true
          message: |
            :broom: Preview cleaned up — Vercel preview deployments removed, Neon branch deleted.
