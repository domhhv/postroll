name: Clean up Preview Deployment
on:
  pull_request:
    types: [closed]

env:
  NODE_VERSION: 24.22.0
  VERCEL_CLI_VERSION: 65.2.0
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  delete-preview:
    name: Remove Vercel preview deployments and Neon database branch
    if: >-
      !contains(github.event.pull_request.body, '[Skip deploy]')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      # Preview deploys are tagged with --meta prNumber=<n> in preview-deploy.yml.
      # `vercel list --json` exposes each deployment's URL (no id), which
      # `vercel remove` accepts.
      - name: Remove Vercel preview deployments
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          urls=$(vercel list --meta prNumber="$PR_NUMBER" --limit 100 --json --yes --non-interactive \
            | jq -r '.deployments[] | select(.target != "production") | .url')
          if [ -z "$urls" ]; then
            echo "No preview deployments found for PR #$PR_NUMBER."
            exit 0
          fi
          echo "Removing: $urls"
          # shellcheck disable=SC2086
          vercel remove $urls --yes --non-interactive

      - name: Delete Neon Branch
        if: ${{ !cancelled() }}
        uses: neondatabase/delete-branch-action@v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Update PR comment with cleanup status
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: deploy-preview
          only_update: true
          skip_unchanged: true
          message: |
            :broom: Preview cleaned up — Vercel preview deployments removed, Neon branch deleted.
