name: Preview Deployment
on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  NODE_VERSION: 24.22.2
  VERCEL_CLI_VERSION: 65.2.0
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

# Explicit `bash` turns on `-o pipefail`, so a failing command in a pipe fails
# the step instead of being masked.
defaults:
  run:
    shell: bash

jobs:
  deploy-preview:
    name: Deploy to Neon and Vercel
    if: >-
      !contains(github.event.pull_request.body, '[Skip deploy]')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: pr-${{ github.event.number }}
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Get code
        uses: actions/checkout@v7.0.1

      - name: Post starting comment
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: deploy-preview
          skip_unchanged: true
          message: |
            ## :rocket: Deploying preview app...
            Installing dependencies...
            Log runs [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get git branch name
        id: branch-name
        uses: tj-actions/branch-names@v9.0.2

      - name: Create database branch on Neon
        id: create-neon-branch
        uses: neondatabase/create-branch-action@6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          role: neondb_owner
          parent_branch: production
          branch_name: preview/${{ steps.branch-name.outputs.current_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Deploy database migrations to preview branch on Neon
        run: pnpm turbo run db:deploy --filter @postroll/database
        env:
          DIRECT_URL: ${{ steps.create-neon-branch.outputs.db_url }}

      - name: Update comment with database status
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: deploy-preview
          skip_unchanged: true
          message: |
            ## :rocket: Deploying preview app...
            Neon DB branch ready: https://console.neon.tech/app/projects/${{ vars.NEON_PROJECT_ID }}/branches/${{ steps.create-neon-branch.outputs.branch_id }}
            Deploying web + gateway to Vercel...
            Log runs [here](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      # One deployment ships both services. The web → gateway binding URL is
      # deployment-aware, so only the Neon branch's DATABASE_URL has to be passed.
      # Every other secret comes from the project's Preview env vars on Vercel.
      - name: Deploy web + gateway to Vercel
        id: deploy
        env:
          DATABASE_URL: ${{ steps.create-neon-branch.outputs.db_url_pooled }}
          PR_NUMBER: ${{ github.event.number }}
        # In non-interactive mode the CLI prints a JSON payload on stdout
        # ({ status, deployment: { url, inspectorUrl, … } }), not a bare URL.
        run: |
          vercel deploy --yes --non-interactive \
            --env DATABASE_URL="$DATABASE_URL" \
            --meta prNumber="$PR_NUMBER" > "$RUNNER_TEMP/deploy.json"
          url=$(jq -r '.deployment.url // .url // empty' "$RUNNER_TEMP/deploy.json")
          inspector=$(jq -r '.deployment.inspectorUrl // .inspectorUrl // empty' "$RUNNER_TEMP/deploy.json")
          if [[ "$url" != https://* ]]; then
            echo "Could not read the deployment URL from the Vercel CLI output:"
            cat "$RUNNER_TEMP/deploy.json"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "inspector=$inspector" >> "$GITHUB_OUTPUT"

      # The gateway is internal-only, so check it end to end through web's
      # /api/health (web → binding → gateway → Neon).
      - name: Smoke test deployment
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3; do
            # No --non-interactive here: `vercel curl` passes unknown flags to curl.
            body=$(vercel curl /api/health --deployment "$URL" --yes || true)
            echo "Attempt $attempt: $body"
            if echo "$body" | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Update comment with success
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: deploy-preview
          skip_unchanged: true
          message: |
            ## Preview deployed successfully! :tada:
            :elephant: Neon DB branch: https://console.neon.tech/app/projects/${{ vars.NEON_PROJECT_ID }}/branches/${{ steps.create-neon-branch.outputs.branch_id }}
            :triangular_flag_on_post: Vercel preview (web + gateway): ${{ steps.deploy.outputs.url }}
            :mag: Vercel deployment details: ${{ steps.deploy.outputs.inspector }}

      - name: Update comment on failure
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: deploy-preview
          skip_unchanged: true
          message: |
            :x: Preview deploy failed — see [run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
