name: Gateway Preview App
on:
  pull_request:
    types: [opened, reopened, synchronize]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_REGION: jnb
  FLY_ORG: personal

jobs:
  deploy-gateway-preview:
    name: Deploy to Neon and Fly.io
    if: >-
      !contains(github.event.pull_request.body, '[Skip CI]')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: pr-${{ github.event.number }}
    environment:
      name: gateway-preview
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Get code
        uses: actions/checkout@v6

      - name: Post starting comment
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          header: deploy-gateway
          skip_unchanged: true
          message: |
            :rocket: Deploying gateway preview… ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Get git branch name
        id: branch-name
        uses: tj-actions/branch-names@v9
      
      - name: Create database branch on Neon
        id: create-neon-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          username: "neondb_owner"
          parent: production
          branch_name: preview/${{ steps.branch-name.outputs.current_branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Set DATABASE_URL and DIRECT_URL env vars
        run: |
          echo "DATABASE_URL=${{ steps.create-neon-branch.outputs.db_url_with_pooler }}" >> "$GITHUB_ENV"
          echo "DIRECT_URL=${{ steps.create-neon-branch.outputs.db_url }}" >> "$GITHUB_ENV"

      - name: Deploy database migrations to preview branch on Neon
        run: pnpm turbo run db:deploy --filter @postroll/database
        env:
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Deploy Gateway PR App to Fly.io
        id: deploy
        uses: superfly/fly-pr-review-apps@1.6.0
        with:
          config: apps/gateway/fly.toml
          secrets: DATABASE_URL=${{ env.DATABASE_URL }}
          launch_options: --dockerfile apps/gateway/Dockerfile
          deploy_options: --dockerfile apps/gateway/Dockerfile

      - name: Set GATEWAY_URL var for Cloudflare Worker deployment
        run: |
          echo "GATEWAY_URL=${{ steps.deploy.outputs.url }}" >> "$GITHUB_ENV"

      - name: Deploy Cloudflare Worker for Gateway PR App
        id: deploy-worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GH_TOKEN }}
          workingDirectory: "apps/web"
          preCommands: pnpm turbo run build:cf --filter @postroll/web
          command: versions upload --var GATEWAY_URL:${{ steps.deploy.outputs.url }}

      - name: Update comment with success
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          header: deploy-gateway
          skip_unchanged: true
          message: |
            Fly Preview URL :balloon: : ${{ steps.deploy.outputs.url }}
            Neon branch :elephant: : https://console.neon.tech/app/projects/${{ vars.NEON_PROJECT_ID }}/branches/${{ steps.create-neon-branch.outputs.branch_id }}
            Cloudflare Worker :cloud: : ${{ steps.deploy-worker.outputs.deployment-url }}

      - name: Update comment on failure
        if: failure()
        uses: marocchino/sticky-pull-request-comment@v3.0.4
        with:
          header: deploy-gateway
          skip_unchanged: true
          message: |
            :x: Gateway preview deploy failed — see [run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
