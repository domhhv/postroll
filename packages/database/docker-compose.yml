services:
  db:
    image: neondatabase/neon_local:latest
    ports:
      - '5432:5432'
    environment:
      NEON_API_KEY: ${NEON_API_KEY:?NEON_API_KEY required, see packages/database/.env.example}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID:?NEON_PROJECT_ID required, see packages/database/.env.example}
      PARENT_BRANCH_ID: ${PARENT_BRANCH_ID:?PARENT_BRANCH_ID required, see packages/database/.env.example}

  shadow-db:
    image: postgres
    restart: always
    shm_size: 256mb
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: shadow
      POSTGRES_PASSWORD: shadow
      POSTGRES_DB: shadow
